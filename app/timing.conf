# Bench overlay: time each satellite packet with the CPU cycle counter and
# print the result over the console (printk, not the logging subsystem).
#   west build -b <board> app -- -DEXTRA_CONF_FILE=timing.conf
CONFIG_SAMPLE_SAT_TX_TIMING=y
# Count with the Cortex-M DWT cycle counter (CPU clock) rather than the
# 32 kHz RTC that nRF SoCs fall back to.
CONFIG_CORTEX_M_DWT=y
